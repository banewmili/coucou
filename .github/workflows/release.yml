name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            echo "Using $XCODE"
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Build Release
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Sign ad hoc
        run: codesign --force --deep -s - "${{ github.workspace }}/build/Coucou.app"

      - name: Zip
        run: |
          ditto -c -k --keepParent \
            "${{ github.workspace }}/build/Coucou.app" \
            "${{ github.workspace }}/Coucou.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Coucou.zip
          generate_release_notes: false
          body: |
            ## First launch

            macOS will say it can't verify Coucou (it's a free side project, not notarized).

            Either open **System Settings → Privacy & Security** and click **Open Anyway**, or run once in Terminal:
            ```
            xattr -dr com.apple.quarantine /Applications/Coucou.app
            ```

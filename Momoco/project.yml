name: Momoco
options:
  bundleIdPrefix: com.banewmili
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"

targets:
  Momoco:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Momoco
        CFBundleDisplayName: Momoco
        CFBundleIdentifier: com.banewmili.momoco
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "To jump to the terminal and send emails."
        NSAccessibilityUsageDescription: "To read the active window title and attach it as context."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banewmili.momoco
        PRODUCT_NAME: Momoco
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_SANDBOX: NO
